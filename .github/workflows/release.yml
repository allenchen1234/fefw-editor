# Builds the Windows .exe, a Linux binary and a source zip, then publishes a
# GitHub release.
#
# Release a new version:
#   1. bump __version__ in editor.py (e.g. "1.0.1") and commit
#   2. git tag v1.0.1 && git push origin v1.0.1
# or run this workflow by hand from the Actions tab and type the tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create / release, e.g. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt pyinstaller==6.11.1

      - name: Check the tag matches the version in editor.py
        shell: python
        run: |
          import os, re, sys
          src = open("editor.py", encoding="utf8").read()
          version = re.search(r'__version__ = "(.+?)"', src).group(1)
          tag = os.environ["TAG"]
          if tag != "v" + version:
              sys.exit(f"Tag {tag} does not match __version__ = {version!r} in editor.py. "
                       f"Bump __version__ or release v{version}.")
          print(f"Releasing {tag}")

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name "FEFW Save Editor"
          --add-data "unit_ids.json;." --add-data "item_ids.json;." --add-data "job_ids.json;."
          --add-data "supports.json;." --add-data "support_points.json;."
          --add-data "flag_names.json;." --add-data "skill_ids.json;."
          editor.py

      - name: Check the data files load
        run: >-
          python -c "import fefw_layer as lay, fefw_core as c, editor_advanced as a, supports;
          assert lay.item_ids() and lay.unit_ids() and lay.job_ids() and supports.pairs()
          and a.flag_names() and c.id_hash('支援会話_アレキサンドラ_カイ_C')
          and len(supports.point_pairs()) == 2628 and supports.max_points() == 3200"

      - name: Package
        shell: pwsh
        run: |
          $name = "FEFW-Save-Editor-$env:TAG"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Force "$stage/icons/items", "$stage/icons/units" | Out-Null
          Copy-Item "dist/FEFW Save Editor.exe", README.md -Destination $stage
          Copy-Item icons/README.md -Destination "$stage/icons"
          Copy-Item icons/items/.gitkeep -Destination "$stage/icons/items"
          Copy-Item icons/units/.gitkeep -Destination "$stage/icons/units"
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "stage/$name" -DestinationPath "out/$name-windows.zip"
          git archive --format zip --prefix "$name-source/" -o "out/$name-source.zip" HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.zip

  linux:
    # Built on the oldest supported Ubuntu so the binary's glibc floor (2.35) is
    # low enough for current Arch, Fedora, Debian 12+, Mint 21+ and so on.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y tk8.6 libtk8.6
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Build binary
        run: >
          pyinstaller --noconfirm --onefile --windowed --name fefw-save-editor
          --add-data "unit_ids.json:." --add-data "item_ids.json:." --add-data "job_ids.json:."
          --add-data "supports.json:." --add-data "support_points.json:."
          --add-data "flag_names.json:." --add-data "skill_ids.json:."
          editor.py

      - name: Check the binary starts
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          DISPLAY=:99 timeout 15 ./dist/fefw-save-editor > run.log 2>&1 || code=$?
          cat run.log
          # timeout's 124 means the window was still open after 15 s, i.e. it started.
          test "${code:-0}" = 124

      - name: Package
        run: |
          name="FEFW-Save-Editor-$TAG"
          stage="stage/$name"
          mkdir -p "$stage/icons/items" "$stage/icons/units" out
          cp dist/fefw-save-editor README.md "$stage/"
          cp icons/README.md "$stage/icons/"
          cp icons/items/.gitkeep "$stage/icons/items/"
          cp icons/units/.gitkeep "$stage/icons/units/"
          tar -C stage -czf "out/$name-linux-x86_64.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*.tar.gz

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Fortune's Weave Save Editor ${{ env.TAG }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: |
            out/*.zip
            out/*.tar.gz
